<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件下载中心</title>
<style>
  :root{
    --bg:#141419; --panel:#1d1d26; --panel2:#24242f; --line:#2e2e3d;
    --fg:#e8e8f0; --dim:#9a9ab0; --faint:#6c6c85;
    /* 主色 #ff9292 系 */
    --pink:#ff9292; --pink-h:#ff7a7a; --pink-a:#e67878; --pink-b:#cc7575; --pink-d:#995858;
    --pink2:#ffb3b3;      /* 深底上更亮的粉(弱强调文字) */
    --on-pink:#2d1414;    /* ff9292 底上的深色文字(9.78:1 AAA,禁白字) */
    /* 辅助色(互补青 + 类似色) */
    --cyan:#92ffff;       /* 互补青:链接/信息 */
    --peach:#ffc892;      /* 蜜桃:警告/标签 */
    --ppink:#ff92c8;      /* 粉紫:分类/次级强调 */
    --bpink:#b0a0ff;      /* 蓝紫:次级强调 */
    --purple:#a78bfa; --purple-d:#534ab7;
    /* 语义色 */
    --green:#6dd58c; --coral:#ff8a5c; --amber:#ffc892; --red:#ff6b6b;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(640px 420px at 12% -6%, rgba(255,146,146,.16), transparent 70%),
      radial-gradient(760px 520px at 90% 110%, rgba(146,255,255,.11), transparent 70%),
      radial-gradient(540px 400px at 62% 128%, rgba(167,139,250,.10), transparent 70%)}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- 顶栏 ---------- */
  header{position:sticky;top:0;z-index:20;background:rgba(20,20,25,.55);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);padding:12px 20px}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    header{background:rgba(20,20,25,.94)}
    .card{background:rgba(255,255,255,.05)}
    .modal{background:#1d1d26}
  }
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .logo{font-size:17px;font-weight:500;letter-spacing:.3px;white-space:nowrap}
  .logo b{color:var(--pink)}
  .inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--fg);font-size:13px;outline:none;min-width:160px;flex:1}
  .inp:focus{border-color:var(--pink)}
  .sel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg);font-size:12.5px;outline:none;cursor:pointer}
  .sel:focus{border-color:var(--pink)}
  .sel option{background:var(--panel2);color:var(--fg)}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--dim);padding:7px 13px;font-size:12.5px;cursor:pointer;border-radius:7px;transition:background .15s}
  .seg button.on{background:var(--pink);color:var(--on-pink);font-weight:500}
  .seg .lbl{display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--faint)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 13px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .btn:hover{border-color:var(--pink);color:var(--pink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.pri{background:var(--pink);border:0;color:var(--on-pink);font-weight:500}
  .btn.pri:hover{background:var(--pink-h);border:0;color:var(--on-pink)}
  .tabs{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:20px;padding:4px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:rgba(255,146,146,.1);border-color:var(--pink);color:var(--pink)}
  .stats{color:var(--faint);font-size:12px;margin:8px 0 12px;display:flex;gap:14px;flex-wrap:wrap}
  .stats b{color:var(--dim);font-weight:500}
  .stats .upd{color:var(--green);font-weight:500}

  /* ---------- 主体 ---------- */
  main{max-width:1180px;margin:0 auto;padding:6px 20px 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .card:hover{border-color:rgba(255,146,146,.75);transform:translateY(-2px)}
  .tile{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;margin-bottom:10px}
  .nm{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st{margin-top:5px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
  .note{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .time{font-size:11px;color:var(--faint);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .time .star{color:var(--amber);font-weight:500}
  .ver{font-family:Consolas,monospace;color:var(--green);background:rgba(109,213,140,.09);border:1px solid rgba(109,213,140,.25);padding:1px 7px;border-radius:6px;font-size:11.5px}
  .ver.none{color:var(--faint);background:transparent;border-color:var(--line)}
  .new{position:absolute;top:10px;right:10px;background:var(--coral);color:var(--on-pink);font-size:10px;font-weight:500;padding:2px 7px;border-radius:8px}
  .card .hint{position:absolute;bottom:10px;right:12px;font-size:10px;color:var(--faint);opacity:0;transition:opacity .15s}
  .card:hover .hint{opacity:1}
  .empty{text-align:center;color:var(--faint);padding:56px 20px;border:1px dashed var(--line);border-radius:13px;font-size:13px}
  .empty .big{font-size:38px;margin-bottom:10px}

  /* ---------- 弹层 ---------- */
  .ov{position:fixed;inset:0;background:rgba(8,8,12,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .ov.show{display:flex}
  .modal{background:rgba(29,29,38,.82);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(255,255,255,.14);border-radius:14px;width:min(640px,100%);max-height:84vh;overflow:auto;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 50px rgba(0,0,0,.5)}
  .mhead{display:flex;gap:12px;align-items:flex-start}
  .mtile{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;flex-shrink:0}
  .mnm{font-size:16px;font-weight:500}
  .mrp{font-size:12px;color:var(--faint);margin-top:3px}
  .mrp a{color:var(--faint)}
  .mrp a:hover{color:var(--cyan)}
  .mcat{display:inline-block;font-size:11px;color:var(--pink);background:rgba(255,146,146,.12);border:1px solid rgba(255,146,146,.3);padding:1px 8px;border-radius:20px;margin-top:6px}
  .mclose{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;flex-shrink:0}
  .mclose:hover{border-color:var(--pink);color:var(--pink)}
  .mstat{display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .latest{background:rgba(255,146,146,.07);border:1px solid rgba(255,146,146,.4);border-radius:12px;padding:14px;margin-top:10px}
  .lhead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .lver{font-family:Consolas,monospace;font-size:16px;font-weight:500;color:var(--pink)}
  .lbadge{background:var(--green);color:#0d2416;font-size:10px;font-weight:500;padding:2px 9px;border-radius:10px;letter-spacing:.3px}
  .assets{display:flex;gap:8px;flex-wrap:wrap}
  .as{display:inline-flex;align-items:center;gap:7px;font-size:12px;border:1px solid rgba(255,146,146,.55);background:rgba(255,146,146,.12);color:var(--pink);border-radius:9px;padding:6px 13px;cursor:pointer;transition:.13s;font-weight:500}
  .as:hover{border-color:var(--pink-h);background:rgba(255,146,146,.25)}
  .as .dl{color:var(--pink);font-size:13px;font-weight:500;line-height:1}
  .latest .as{padding:9px 18px;font-size:13px}
  .latest .as .dl{font-size:15px}
  .pl{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:#fff;flex-shrink:0}
  .plw{background:#3f6f9e}.plm{background:#5a5a6e}.pll{background:#4a7a55}.plo{background:#555}
  .hsec{font-size:11px;color:var(--faint);margin:16px 0 2px;display:flex;align-items:center;gap:10px}
  .hsec:after{content:"";flex:1;height:1px;background:var(--line)}
  .hrel{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid rgba(46,46,61,.5);flex-wrap:wrap}
  .hrel:last-of-type{border-bottom:0}
  .chip{font-family:Consolas,monospace;font-size:11.5px;color:var(--dim);background:rgba(46,46,61,.6);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  .hrel .as{padding:4px 10px;font-size:11px;border-color:var(--line);background:var(--panel2);color:var(--dim)}
  .hrel .as .dl{color:var(--faint);font-size:11px}
  .hrel .as:hover{color:var(--pink);border-color:var(--pink)}
  .dat{font-size:11px;color:var(--faint);min-width:44px}
  .none{font-size:11px;color:var(--faint)}
  .more{width:100%;border:1px dashed var(--line);background:transparent;color:var(--dim);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;margin-top:6px}
  .more:hover{border-color:var(--pink);color:var(--pink)}
  .mops{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .ghlink{color:var(--faint);font-size:12px;margin-left:auto}
  .ghlink:hover{color:var(--cyan)}

  /* ---------- 表单弹层 ---------- */
  .modal h3{font-size:15px;margin-bottom:14px}
  .row{margin-bottom:12px}
  .row label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
  .row input,.row select,.row textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 11px;font-size:13.5px;outline:none}
  .row input:focus,.row textarea:focus{border-color:var(--pink)}
  .row textarea{resize:vertical;min-height:70px;font-family:Consolas,monospace;font-size:12.5px}
  .row .tips{font-size:11.5px;color:var(--faint);margin-top:4px}
  .row .err{color:var(--red);font-size:12.5px;margin-top:8px;display:none}
  .mfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}

  /* ---------- 其他 ---------- */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;white-space:nowrap}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">软件<b>下载</b>中心</div>
    <input class="inp" id="q" placeholder="搜索软件 / 仓库 / 备注…">
    <select class="sel" id="bSort" title="排序方式">
      <option value="date">按更新日期</option>
      <option value="stars">按 Star</option>
      <option value="name">按名称</option>
    </select>
    <div class="seg" id="plat"><span class="lbl">平台</span><button data-p="all" class="on">全部</button><button data-p="win">Win</button><button data-p="mac">Mac</button><button data-p="linux">Lin</button></div>
    <button class="btn" id="bAdd">+ 添加</button>
    <button class="btn" id="bBatch">批量添加</button>
    <button class="btn" id="bRefreshAll">全部刷新</button>
    <button class="btn" id="bSet">设置</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><div class="big">📭</div><div id="emptyText">清单为空，点击右上角「+ 添加」开始收录</div></div>
</main>

<!-- 详情弹层 -->
<div class="ov" id="ovDetail">
  <div class="modal" id="detailModal"></div>
</div>

<!-- 添加/编辑弹层 -->
<div class="ov" id="ovEdit">
  <div class="modal" style="max-width:520px">
    <h3 id="editTitle">添加软件</h3>
    <div class="row"><label>名称（留空自动用仓库名）</label><input id="fName" placeholder="如：Tools Center"></div>
    <div class="row"><label>GitHub 仓库链接 <span style="color:var(--red)">*</span></label><input id="fRepo" placeholder="https://github.com/owner/repo 或 owner/repo"><div class="tips">添加后自动拉取最新 Release</div></div>
    <div class="row"><label>分类</label><input id="fCat" placeholder="如：工具 / 插件 / 脚本"></div>
    <div class="row"><label>备注</label><textarea id="fNote" style="min-height:48px"></textarea></div>
    <div class="row"><div class="err" id="editErr"></div></div>
    <div class="mfoot"><button class="btn" id="btnEditCancel">取消</button><button class="btn pri" id="btnEditSave">保存</button></div>
  </div>
</div>

<!-- 批量添加弹层 -->
<div class="ov" id="ovBatch">
  <div class="modal" style="max-width:560px">
    <h3>批量添加软件</h3>
    <div class="row"><label>每行一个仓库（支持 owner/repo 或完整链接）</label><textarea id="fBatch" placeholder="Simiely/tools-center&#10;https://github.com/Simiely/knowledge-base&#10;microsoft/PowerToys"></textarea><div class="tips" id="batchStat">将逐条校验并添加，重复仓库自动跳过</div></div>
    <div class="row"><div class="err" id="batchErr"></div></div>
    <div class="mfoot"><button class="btn" id="btnBatchCancel">取消</button><button class="btn pri" id="btnBatchGo">开始添加</button></div>
  </div>
</div>

<!-- 设置弹层 -->
<div class="ov" id="ovSet">
  <div class="modal" style="max-width:520px">
    <h3>设置</h3>
    <div class="row"><label>GitHub Token（可选）</label><input id="fToken" type="password" placeholder="ghp_... 提高速率并支持私有仓库"><div class="tips">无 Token 公共 API 限 60 次/小时；配置后 5000 次/小时</div></div>
    <div class="row"><label>代理地址（可选）</label><input id="fProxy" placeholder="如 http://127.0.0.1:7890"><div class="tips">大陆网络直连 GitHub 不稳时填写，留空直连</div></div>
    <div class="row"><label>「显示更早」每次增量</label><input id="fPerPage" type="number" min="1" max="50"></div>
    <div class="row"><div class="err" id="setErr"></div></div>
    <div class="mfoot"><button class="btn" id="btnSetCancel">取消</button><button class="btn pri" id="btnSetSave">保存</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= 状态与工具 ================= */
const BASE = window.__BASE__ || "";
const $ = (id) => document.getElementById(id);
const PLAT_ICON = { win: "W", mac: "M", linux: "L" };
const PLAT_CLS = { win: "plw", mac: "plm", linux: "pll" };
const PLAT_NAME = { win: "Windows", mac: "macOS", linux: "Linux" };

let state = {
  q: "", cat: "all", plat: "all",   // 筛选
  sortBy: "date",                   // date | stars | name(级联:主排序相同→更新时间→名称)
  software: [],                      // 全量软件(含缓存 releases)
  map: {},                           // id -> software 快照
  hasNew: {},                        // id -> true(有新版)
  checking: false,
  detailId: null,                    // 当前打开的详情 id
  editingId: null,                   // 编辑中的 id(null=新增)
};

async function api(path, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(BASE + "/api" + path, {
      headers: { "Content-Type": "application/json" }, ...opts, signal: ctrl.signal,
    });
    const data = await res.json().catch(() => ({ ok: false, message: "响应解析失败" }));
    if (!data.ok) throw new Error(data.message || `请求失败(${res.status})`);
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("请求超时，请重试");
    throw e;
  } finally { clearTimeout(timer); }
}

let toastTimer = null;
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.opacity = "0"), 2600);
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtTime(iso) { if (!iso) return ""; const d = new Date(iso); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function catColor(cat) {
  const map = { "工具": "#85B7EB", "插件": "#AFA9EC", "脚本": "#ED93B1", "AE 脚本": "#ED93B1", "浏览器扩展": "#9FE1CB", "3D": "#FAC775", "Windows": "#F0997B", "指南": "#97C459", "文档": "#B4B2A9" };
  return map[cat] || "#888780";
}
function tileText(name) { return (name || "?").slice(0, 2).toUpperCase(); }
function platOf(s) { return (s.releases || []).flatMap((r) => (r.assets || []).map((a) => a.platform)); }
function latestOf(s) { return (s.releases || [])[0] || null; }
function byDate(s) { const r = s.releases?.[0]?.publishedAt; return r ? Date.parse(r) : (s.createdAt || 0); }
function fmtStars(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); }
/* 级联排序:主排序相同 → 更新时间 → 名称兜底 */
function cmpSort(a, b) {
  const da = byDate(a), db = byDate(b);
  const sa = a.stars ?? -1, sb = b.stars ?? -1;
  const na = (a.name || "").localeCompare(b.name || "", "zh");
  const byDateCmp = db - da, byStarsCmp = sb - sa;
  if (state.sortBy === "name") return na || byDateCmp || byStarsCmp;
  if (state.sortBy === "stars") return byStarsCmp || byDateCmp || na;
  return byDateCmp || byStarsCmp || na;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove(); return ok;
    } catch { return false; }
  }
}

/* ================= 数据加载 ================= */
async function loadAll() {
  try {
    const d = await api("/software");
    state.software = d.software;
    state.map = {};
    d.software.forEach((s) => (state.map[s.id] = s));
    render();
  } catch (e) { toast(e.message, true); }
}

async function checkUpdates() {
  if (state.checking) return;
  state.checking = true;
  const btn = $("bRefreshAll");
  btn.disabled = true; btn.textContent = "检查中…";
  try {
    const d = await api("/check-updates", { method: "POST" });
    state.hasNew = {};
    (d.hasNew || []).forEach((id) => (state.hasNew[id] = true));
    render();
    await loadAll();
    toast(d.hasNew?.length ? `发现 ${d.hasNew.length} 个软件有新版` : "全部是最新版本");
  } catch (e) { toast(e.message, true); }
  finally { state.checking = false; btn.disabled = false; btn.textContent = "全部刷新"; }
}

/* ================= 渲染 ================= */
function cats() { return [...new Set(state.software.map((s) => s.category || "未分类"))].sort(); }
function renderTabs() {
  $("tabs").innerHTML = `<button data-c="all" class="${state.cat === "all" ? "on" : ""}">全部</button>` +
    cats().map((c) => `<button data-c="${esc(c)}" class="${state.cat === c ? "on" : ""}">${esc(c)}</button>`).join("");
}
function renderStats(shown) {
  const newCount = Object.keys(state.hasNew).length;
  $("stats").innerHTML = `<span><b>${state.software.length}</b> 个软件</span>` +
    `<span>${newCount ? `发现 <b class="upd">${newCount}</b> 个有新版本` : "已是最新版本"}</span>` +
    `<span>${state.q || state.cat !== "all" || state.plat !== "all" ? `筛出 ${shown.length} 个` : ""}</span>`;
}
function card(s) {
  const col = catColor(s.category);
  const latest = latestOf(s);
  const verHtml = latest ? `<span class="ver">${esc(latest.tag)}</span>` : `<span class="ver none">暂无 Release</span>`;
  const newHtml = state.hasNew[s.id] ? '<span class="new">NEW</span>' : "";
  const time = latest ? latest.publishedAt : s.createdAt;
  return `<div class="card" data-id="${esc(s.id)}">
    <span class="hint">查看详情</span>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="tile" style="background:${col}22;color:${col};border:1px solid ${col}44">${esc(tileText(s.name))}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(s.name)}</div>
        <div class="st">${verHtml}</div>
      </div>
      ${newHtml}
    </div>
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
    <div class="time"><span>${fmtTime(time)}</span>${s.stars != null ? `<span class="star">★ ${fmtStars(s.stars)}</span>` : ""}</div>
  </div>`;
}
function render() {
  const q = state.q.trim().toLowerCase();
  const shown = state.software.filter((s) => {
    if (q && ![s.name, s.owner + "/" + s.repo, s.category, s.note].join(" ").toLowerCase().includes(q)) return false;
    if (state.cat !== "all" && (s.category || "未分类") !== state.cat) return false;
    if (state.plat !== "all" && !platOf(s).includes(state.plat)) return false;
    return true;
  });
  $("grid").innerHTML = shown.sort(cmpSort).map(card).join("");
  $("empty").hidden = shown.length > 0;
  $("emptyText").textContent = state.software.length ? "没有匹配的软件 — 试试清空筛选条件" : "清单为空，点击右上角「+ 添加」开始收录";
  renderTabs();
  renderStats(shown);
}

/* ================= 详情弹层 ================= */
function assetBtn(a, cls) {
  const p = a.platform || "other";
  return `<span class="as" data-dl data-name="${esc(a.name)}" data-url="${esc(a.url)}" title="直接下载 ${esc(a.name)}">
    <span class="dl">↓</span><span class="pl ${PLAT_CLS[p] || "plo"}">${PLAT_ICON[p] || "•"}</span>${esc(a.name)}
    <span style="color:var(--faint);font-weight:400">${a.sizeText || ""}</span></span>`;
}
function openDetail(id) {
  const s = state.map[id];
  if (!s) return;
  state.detailId = id;
  const rels = s.releases || [];
  const latest = rels[0];
  const hist = rels.slice(1);
  const col = catColor(s.category);
  const newHtml = state.hasNew[id] ? ' <span class="new" style="position:static;display:inline-block;margin-left:6px">NEW</span>' : "";
  let latestHtml = "";
  if (latest) {
    const as = (latest.assets || []).map((a) => assetBtn(a, true)).join("") || '<span class="none">无下载资产</span>';
    latestHtml = `<div class="latest"><div class="lhead"><span class="lver">${esc(latest.tag)}</span><span class="lbadge">LATEST</span><span class="ldate">${fmtTime(latest.publishedAt)} 发布</span></div><div class="assets">${as}</div></div>`;
  }
  const histHtml = hist.length ? hist.map((r) => {
    const as = (r.assets || []).map((a) => assetBtn(a, false)).join("") || '<span class="none">无下载资产</span>';
    return `<div class="hrel"><span class="chip">${esc(r.tag)}</span><span class="dat">${fmtTime(r.publishedAt)}</span><span class="assets">${as}</span></div>`;
  }).join("") : "";
  const more = s.hasMore ? `<button class="more" data-more>显示更早的 ${Math.min(s.total != null ? Math.max(0, s.total - rels.length) : 3, 3)} 个版本 · 已加载 ${rels.length}${s.total != null ? "/" + s.total : ""}</button>` : "";
  $("detailModal").innerHTML = `
    <div class="mhead">
      <div class="mtile" style="background:${col}22;color:${col};border:1px solid ${col}44">${esc(tileText(s.name))}</div>
      <div><div class="mnm">${esc(s.name)}${newHtml}</div><div class="mrp"><a href="https://github.com/${esc(s.owner)}/${esc(s.repo)}" target="_blank" rel="noopener">${esc(s.owner)}/${esc(s.repo)}</a></div><span class="mcat">${esc(s.category || "未分类")}</span></div>
      <button class="mclose" title="关闭 (Esc)">✕</button>
    </div>
    <div class="mstat"><span>${rels.length ? "共 " + (s.total != null ? s.total : rels.length) + " 个版本" : "暂无 Release"}</span></div>
    ${s.note ? `<div style="font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.6">${esc(s.note)}</div>` : ""}
    ${latestHtml || '<div style="color:var(--faint);font-size:12px;padding:12px 0">该仓库暂无 Release — 点击上方 ↻ 刷新</div>'}
    ${histHtml ? `<div class="hsec">历史版本</div>${histHtml}${more}` : more}
    <div class="mops">
      <button class="btn" data-act="copy">复制链接</button>
      <button class="btn" data-act="refresh">刷新</button>
      <button class="btn" data-act="edit">编辑</button>
      <button class="btn" style="color:var(--red)" data-act="del">删除</button>
      <a class="ghlink" href="https://github.com/${esc(s.owner)}/${esc(s.repo)}/releases" target="_blank" rel="noopener">GitHub 页面 ↗</a>
    </div>`;
  $("ovDetail").classList.add("show");
}
function closeDetail() { $("ovDetail").classList.remove("show"); state.detailId = null; }

/* ================= 编辑 / 批量 / 设置 ================= */
function openEdit(id) {
  state.editingId = id;
  $("editErr").style.display = "none";
  const s = id ? state.map[id] : null;
  $("editTitle").textContent = id ? "编辑软件" : "添加软件";
  $("fName").value = s ? s.name : "";
  $("fRepo").value = s ? `${s.owner}/${s.repo}` : "";
  $("fRepo").disabled = !!id;
  $("fRepo").style.opacity = id ? 0.5 : 1;
  $("fCat").value = s ? s.category : "";
  $("fNote").value = s ? s.note : "";
  $("ovEdit").classList.add("show");
}
function closeEdit() { $("ovEdit").classList.remove("show"); state.editingId = null; }

async function openSettings() {
  try {
    const d = await api("/settings");
    $("fToken").value = d.settings.githubToken || "";
    $("fProxy").value = d.settings.proxy || "";
    $("fPerPage").value = d.settings.perPage || 3;
    $("setErr").style.display = "none";
    $("ovSet").classList.add("show");
  } catch (e) { toast(e.message, true); }
}

/* ================= 事件 ================= */
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("plat").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.plat = b.dataset.p;
  document.querySelectorAll("#plat button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.cat = b.dataset.c; render();
});
$("grid").addEventListener("click", (e) => {
  const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id);
});
$("ovDetail").addEventListener("click", async (e) => {
  if (e.target === $("ovDetail")) return closeDetail();
  const dl = e.target.closest("[data-dl]");
  if (dl) {
    window.open(dl.dataset.url, "_blank", "noopener");
    toast("开始下载 " + dl.dataset.name);
    return;
  }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("mclose")) return closeDetail();
  const act = b.dataset.act;
  if (!act) return;
  const id = state.detailId;
  const s = state.map[id];
  try {
    if (act === "copy") {
      const latest = latestOf(s);
      const url = latest && latest.assets.length ? latest.assets[0].url : `https://github.com/${s.owner}/${s.repo}/releases`;
      toast(await copyText(url) ? "最新版下载链接已复制" : "复制失败，请手动复制", !(await copyText(url)));
    } else if (act === "refresh") {
      const d = await api(`/software/${id}/refresh`, { method: "POST" });
      state.map[id] = { ...state.map[id], releases: d.releases, hasMore: d.hasMore, total: d.total };
      openDetail(id); toast("已重新拉取");
    } else if (act === "edit") { closeDetail(); openEdit(id); }
    else if (act === "del") {
      if (!confirm("确定删除该软件？")) return;
      await api(`/software/${id}`, { method: "DELETE" });
      delete state.map[id];
      state.software = state.software.filter((x) => x.id !== id);
      closeDetail(); render(); toast("已删除");
    }
  } catch (err) { toast(err.message, true); }
});
$("ovDetail").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-more]");
  if (!b) return;
  const id = state.detailId; const s = state.map[id];
  const count = (s.releases || []).length;
  const page = Math.floor(count / 3) + 1;
  b.disabled = true; b.textContent = "加载中…";
  try {
    const d = await api(`/software/${id}/releases?page=${page}`);
    state.map[id] = { ...state.map[id], releases: d.releases, hasMore: d.hasMore, total: d.total };
    openDetail(id);
  } catch (err) { toast(err.message, true); b.disabled = false; b.textContent = "显示更早…"; }
});

/* 添加/编辑 */
$("bAdd").addEventListener("click", () => openEdit(null));
$("btnEditCancel").addEventListener("click", closeEdit);
$("btnEditSave").addEventListener("click", async () => {
  const body = { name: $("fName").value.trim(), repoUrl: $("fRepo").value.trim(), category: $("fCat").value.trim(), note: $("fNote").value.trim() };
  $("editErr").style.display = "none";
  try {
    if (state.editingId) {
      await api(`/software/${state.editingId}`, { method: "PUT", body: JSON.stringify({ name: body.name, category: body.category, note: body.note }) });
      toast("已保存");
    } else {
      if (!body.repoUrl) return toast("请填写仓库链接", true);
      await api("/software", { method: "POST", body: JSON.stringify(body) });
      toast("已添加并拉取最新 Release");
    }
    closeEdit(); await loadAll();
  } catch (e) { $("editErr").textContent = e.message; $("editErr").style.display = "block"; }
});

/* 批量添加 */
$("bBatch").addEventListener("click", () => { $("fBatch").value = ""; $("batchErr").style.display = "none"; $("batchStat").textContent = "将逐条校验并添加，重复仓库自动跳过"; $("ovBatch").classList.add("show"); });
$("btnBatchCancel").addEventListener("click", () => $("ovBatch").classList.remove("show"));
$("btnBatchGo").addEventListener("click", async () => {
  const lines = $("fBatch").value.split("\n").map((s) => s.trim()).filter(Boolean);
  if (!lines.length) return toast("请粘贴至少一个仓库", true);
  $("batchErr").style.display = "none";
  const btn = $("btnBatchGo"); btn.disabled = true; btn.textContent = "添加中…";
  let ok = 0, fail = 0, dup = 0, i = 0;
  for (const line of lines) {
    i++;
    $("batchStat").textContent = `正在添加 ${i}/${lines.length}：${line}`;
    try {
      const d = await api("/software", { method: "POST", body: JSON.stringify({ repoUrl: line }) });
      ok++;
    } catch (e) {
      if (e.message.includes("已在清单")) dup++;
      else { fail++; $("batchErr").textContent = `「${line}」失败：${e.message}`; $("batchErr").style.display = "block"; }
    }
  }
  btn.disabled = false; btn.textContent = "开始添加";
  toast(`完成：新增 ${ok}，重复 ${dup}，失败 ${fail}`);
  $("ovBatch").classList.remove("show");
  await loadAll();
});

/* 全部刷新 + 设置 */
$("bRefreshAll").addEventListener("click", checkUpdates);
$("bSort").addEventListener("change", (e) => { state.sortBy = e.target.value; render(); });
$("bSet").addEventListener("click", openSettings);
$("btnSetCancel").addEventListener("click", () => $("ovSet").classList.remove("show"));
$("btnSetSave").addEventListener("click", async () => {
  try {
    await api("/settings", { method: "PUT", body: JSON.stringify({
      githubToken: $("fToken").value.trim(), proxy: $("fProxy").value.trim(),
      perPage: parseInt($("fPerPage").value, 10) || 3,
    }) });
    $("ovSet").classList.remove("show"); toast("设置已保存");
  } catch (e) { $("setErr").textContent = e.message; $("setErr").style.display = "block"; }
});

/* 遮罩点击关闭 + Esc */
document.querySelectorAll(".ov").forEach((ov) => ov.addEventListener("click", (e) => { if (e.target === ov) ov.classList.remove("show"); }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".ov.show").forEach((ov) => ov.classList.remove("show")); });

loadAll();
</script>
</body>
</html>
